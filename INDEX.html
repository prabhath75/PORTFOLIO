</div><script>
const boxes=[...document.querySelectorAll("input")];
const saved=JSON.parse(localStorage.getItem("planner")||"{}");
boxes.forEach(b=>{if(saved[b.id])b.checked=true;b.onchange=update;});
function update(){
let done=0,data={};
boxes.forEach(b=>{if(b.checked)done++;data[b.id]=b.checked;});
localStorage.setItem("planner",JSON.stringify(data));
document.getElementById("bar").style.width=(done/boxes.length*100)+"%";
document.getElementById("stats").textContent=`${done}/${boxes.length} Sessions Completed (${Math.round(done/boxes.length*100)}%)`;
}
update();
